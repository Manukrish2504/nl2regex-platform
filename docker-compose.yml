# Development stack: `docker compose up --build` brings everything up.
#   UI             http://localhost:5173
#   API            http://localhost:8000/api/health/
#   Flower         http://localhost:5555   Celery workers, queues and tasks
#   Spark cluster  http://localhost:8080   the master: its workers and applications
#   Spark job      http://localhost:4040   stages and tasks, only while a job is running

x-backend: &backend
  # Every backend service builds the same Dockerfile, so the layers (about 2 GB with Spark, Java
  # and the S3 connector) are built and stored once, under one tag per service.
  build: ./backend
  volumes:
    - ./backend:/app
    # Job output. Workers write it and the web process pages through it, so both mount it.
    - results:/data
  environment:
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,web}
    # Dev-only default. Web and worker must share it; production must supply its own
    # (generate: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())").
    CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-uAWLf857qzm9wBcJZE6-m0rANNqQGYVj-x9t2Ow3kvw=}
    POSTGRES_HOST: postgres
    POSTGRES_DB: nl2regex
    POSTGRES_USER: nl2regex
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nl2regex}
    REDIS_URL: redis://redis:6379
    RESULTS_DIR: /data/results
    # Optional. Without it, describing a pattern in plain English is switched off and the rest
    # works. Put it in a git-ignored .env beside this file; either name is read.
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-${CLAUDE_API_KEY:-}}
    LLM_MODEL: ${LLM_MODEL:-claude-opus-5}
    # "streaming" swaps Spark for the single-process reference engine, which needs no JVM.
    TRANSFORM_ENGINE: ${TRANSFORM_ENGINE:-spark}
    # Set to local[N] to run Spark inside the job worker instead, on a machine too small for a
    # cluster. The engine is the same either way.
    SPARK_MASTER_URL: ${SPARK_MASTER_URL:-spark://spark-master:7077}
    SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-1g}
    SPARK_CORES_MAX: ${SPARK_CORES_MAX:-}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nl2regex
      POSTGRES_USER: nl2regex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nl2regex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nl2regex"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10

  web:
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  # Light work: file previews. Kept apart from jobs so a preview never waits behind one.
  worker:
    <<: *backend
    command: celery -A config worker --loglevel info -Q celery --concurrency 2 -n light@%h

  # Jobs. Each one is the driver of a Spark application, so its concurrency is how many
  # applications the cluster holds at once. With more than one, set SPARK_CORES_MAX to each
  # job's share of the cluster's cores, or the first job takes them all and the rest wait.
  worker-jobs:
    <<: *backend
    # One task per process: a job's Spark JVM is a child of the process that ran it, so it ends
    # with the job and takes that connection's keys and cached S3 clients with it.
    command: >
      celery -A config worker --loglevel info -Q jobs -n jobs@%h
      --concurrency ${JOB_CONCURRENCY:-1} --max-tasks-per-child 1
    # A JVM outlives the process that started it by a moment, so it is orphaned when it exits.
    # An init process adopts and reaps it; with Celery as PID 1 every job would leave a zombie.
    init: true
    ports:
      - "4040:4040"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      spark-master:
        condition: service_started

  # A standalone Spark cluster. The pip package of PySpark ships bin/spark-class but not the
  # start-*.sh scripts, which would daemonize anyway; a container wants the foreground process.
  spark-master:
    build: ./backend
    command: spark-class org.apache.spark.deploy.master.Master --host spark-master
    init: true
    ports:
      - "8080:8080"

  # Scale out with `docker compose up -d --scale spark-worker=4`.
  spark-worker:
    build: ./backend
    command: >
      spark-class org.apache.spark.deploy.worker.Worker
      --cores ${SPARK_WORKER_CORES:-2} --memory ${SPARK_WORKER_MEMORY:-2g}
      --work-dir /tmp/spark-work spark://spark-master:7077
    init: true
    volumes:
      # Executors write the result files, and read an Excel file once it is converted.
      - results:/data
    deploy:
      replicas: 2
    depends_on:
      - spark-master

  flower:
    <<: *backend
    command: celery -A config flower --port=5555
    ports:
      - "5555:5555"

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      API_PROXY_TARGET: http://web:8000
    command: sh -c "npm ci && npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      - web

volumes:
  pgdata:
  results:
  frontend_node_modules:
