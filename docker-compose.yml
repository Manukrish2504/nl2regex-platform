# Development stack: `docker compose up --build` brings everything up.
#   UI      http://localhost:5173
#   API     http://localhost:8000/api/health/
#   Flower  http://localhost:5555

x-backend: &backend
  build: ./backend
  volumes:
    - ./backend:/app
  environment:
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,web}
    POSTGRES_HOST: postgres
    POSTGRES_DB: nl2regex
    POSTGRES_USER: nl2regex
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nl2regex}
    REDIS_URL: redis://redis:6379
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nl2regex
      POSTGRES_USER: nl2regex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nl2regex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nl2regex"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10

  web:
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: celery -A config worker --loglevel info --concurrency 2

  flower:
    <<: *backend
    command: celery -A config flower --port=5555
    ports:
      - "5555:5555"

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      API_PROXY_TARGET: http://web:8000
    command: sh -c "npm ci && npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      - web

volumes:
  pgdata:
  frontend_node_modules:
